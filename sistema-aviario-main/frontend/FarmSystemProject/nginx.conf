server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nao anunciar a versao do nginx nas respostas e paginas de erro.
    server_tokens off;

    # Limite de corpo: as rotas da API recebem JSON pequeno.
    client_max_body_size 2m;

    # Cabecalhos de seguranca aplicados a todas as respostas (inclusive erros).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy reverso para a API. E por aqui que o backend e alcancado:
    # o container do backend nao publica porta nenhuma no host.
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        # Sem isso a API enxerga o IP do proxy e o esquema http,
        # e nao os do cliente real.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Swagger. Continua respondendo 404 enquanto SWAGGER_ENABLED=false
    # no .env - o proxy so existe para o momento de cadastrar sensores.
    location /swagger {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Caso não encontre nenhuma página, redireciona para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
